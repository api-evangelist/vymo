apis:
- name: Vymo Platform API
  description: >-
    Vymo's enterprise platform API, used by banks, insurers and asset managers to push
    leads into Vymo, sync users and hierarchies, read activity and engagement records, and
    connect Vymo to CRM and core systems. The API is real and operating but it is NOT
    public: its reference is hosted on a private Read the Docs Business site
    (docs.getvymo.com) that returns "Log in to view this documentation" to anonymous
    requests, and the API host answers every anonymous request with
    {"authentication_error":"unauthorized"}. No OpenAPI, GraphQL SDL, AsyncAPI, Postman
    collection or SDK is published anywhere. Access is granted through an enterprise
    agreement rather than self-serve signup.
  humanURL: https://vymo.com/integrations/
  baseURL: https://app.lms.getvymo.com
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/vymo.png
  tags:
  - Sales Engagement
  - Lead Management
  - Financial Services
  - Distribution Management
  x-access: gated
  x-access-note: >-
    Established by probe on 2026-08-13, not by claim. docs.getvymo.com resolves to
    Read the Docs Business and 302s anonymous requests to
    app.readthedocs.com/accounts/login/. app.lms.getvymo.com returns HTTP 200 with the
    39-byte body {"authentication_error":"unauthorized"} for every path probed, including
    /openapi.json, /swagger.json, /v1/openapi.json, /api-docs and every /.well-known/*.
  x-not-our-contract: >-
    Third-party portals publish their own interfaces INTO Vymo — e.g. HDFC Bank's
    "Vymo_Push_Lead" listing at developer.hdfc.bank.in/vymopushlead, which the portal itself
    labels "API Developed By: Outsource" and serves from HDFC's host with no spec link.
    That is HDFC's contract on HDFC's domain and was deliberately NOT harvested as Vymo's.
  properties: []
